name: Build & Deploy GitHub Pages (dual builds, parallel)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # 8 vCPU: docusaurus `faster` mode spreads SSG over worker threads, and this site
    # generates ~4k pages across the versioned docs
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - mode: docs
            repo: gofiber/docs
            cname: docs.gofiber.io
          - mode: home
            repo: gofiber/website
            cname: gofiber.io
    env:
      # Only pushes and manual runs on the default branch publish.
      PUBLISH: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'main' || github.ref_name == 'master') }}
    outputs:
      # Set by the docs leg only, the home leg leaves it empty.
      pages-artifact: ${{ steps.pages.outputs.artifact_id }}

    steps:
      - name: Get previous workflow status
        uses: Mercymeilya/last-workflow-status@f86bce177498d6fdd3bda4113d7d93266cfc3fca # v0.3.5
        id: last_status
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # npm ci runs third-party install scripts in this workspace; don't leave
          # the token in .git/config for them. gh-pages pushes with its own PAT.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Restore build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Per target: both fill their own rspack bucket, and with one shared key
          # the job that finishes first pins the cache, leaving the other to bundle
          # cold every run. .docusaurus is dropped, every build regenerates it.
          path: node_modules/.cache
          key: docusaurus-${{ runner.os }}-node24-${{ matrix.target.mode }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            docusaurus-${{ runner.os }}-node24-${{ matrix.target.mode }}-

      - name: Install deps
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build (${{ matrix.target.mode }})
        env:
          NODE_ENV: production
          BUILD_TARGET: ${{ matrix.target.mode }}
          INKEEP_API_KEY: ${{ secrets.INKEEP_API_KEY }}
          INKEEP_INTEGRATION_ID: ${{ secrets.INKEEP_INTEGRATION_ID }}
          INKEEP_ORGANIZATION_ID: ${{ secrets.INKEEP_ORGANIZATION_ID }}
        run: |
          npm run build:${{ matrix.target.mode }}

      # The docs go out as a Pages artifact: no push of the whole site to a branch
      # and no second Pages build after it. publish-docs deploys it.
      - name: Upload Pages artifact (on master)
        id: pages
        if: env.PUBLISH == 'true' && matrix.target.mode == 'docs'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build
          # .well-known/security.txt has to be published too
          include-hidden-files: true

      # gofiber.io lives in another repo, which a Pages artifact cannot reach.
      - name: Deploy to ${{ matrix.target.cname }} (on master)
        if: env.PUBLISH == 'true' && matrix.target.mode == 'home'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}   # PAT with Contents: Read and write on both repos
          external_repository: ${{ matrix.target.repo }}
          publish_dir: ./build
          publish_branch: gh-pages
          cname: ${{ matrix.target.cname }}
          force_orphan: true
      - uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        if: ${{ failure() || (success() && steps.last_status.outputs.last_status == 'failure') }}
        with:
          title: "deploy"
          description: "Docs: Build & Deploy GitHub Pages"
          webhook: ${{ secrets.DISCORD_SECURE_CHANNEL }}

  publish-docs:
    needs: deploy
    # !cancelled(): a failed home leg must not hold back the docs.
    if: ${{ !cancelled() && needs.deploy.outputs.pages-artifact != '' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    # Kept out of the build job, which runs third-party install scripts.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to docs.gofiber.io
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        if: ${{ failure() }}
        with:
          title: "deploy"
          description: "Docs: Deploy GitHub Pages"
          webhook: ${{ secrets.DISCORD_SECURE_CHANNEL }}
